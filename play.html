<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doug Platformer</title>
<style>
body {
  background-color: #0000ff;
  font-family: "Courier New", Courier, monospace;
  touch-action: none;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: rgba(0,0,0,0);
}
.disable-select,
.disable-select * {
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  -moz-user-select: none;
  -ms-user-select: none;
  user-select: none;
}
#errormessage,
#errormessage * {
  -webkit-user-select: text;
  -moz-user-select: text;
  -ms-user-select: text;
  user-select: text;
  -webkit-touch-callout: default;
}
#gameCanvas {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  width: 100%; height: 100%;
  border: 0;
  background-color: #0000ff;
  image-rendering: -moz-crisp-edges;
  image-rendering: -webkit-crisp-edges;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
}
h1 {
  color: lightblue;
  font-weight: normal;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  height: 2em;
  margin: 0.5em 0;
}
a { color: lightblue; }
.title {
  text-align: center;
  font-size: 100%;
  color: gray;
  position: absolute;
  left: 10%; right: 10%; top: 0;
  height: 3em;
}
.footer {
  text-align: center;
  color: white;
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 3em;
}
.gameContainer {
  position: absolute;
  left: 0; right: 0;
  top: 3.5em; bottom: 3em;
  touch-action: none;
}
#resetBtn,
#copyErrBtn {
  position: absolute;
  width: 2.5em; height: 2.5em;
  border-radius: 50%;
  border: 1px solid rgba(255,255,255,0.4);
  background: rgba(0,0,0,0.4);
  color: white;
  font-family: inherit;
  font-size: 1.2em;
  cursor: pointer;
  z-index: 10;
  -webkit-tap-highlight-color: rgba(0,0,0,0);
}
#resetBtn   { right: 0.5em; bottom: 0.5em; }
#copyErrBtn { right: 3.5em; bottom: 0.5em; display: none; }
#copyErrBtn.show { display: block; }
</style>
</head>
<body>
<div class="title"><h1 id="gametitle">Doug Platformer</h1></div>
<div class="gameContainer" id="gameContainer">
  <canvas id="gameCanvas"></canvas>
</div>
<div class="footer"><span id="errormessage"></span></div>
<button id="resetBtn" title="Clear saved progress and reload">&#x21BA;</button>
<button id="copyErrBtn" title="Copy error text to clipboard">&#x1F4CB;</button>

<script src="./vendor/puzzlescript/js/storagewrapper.js"></script>
<script src="./vendor/puzzlescript/js/bitvec.js"></script>
<script src="./vendor/puzzlescript/js/level.js"></script>
<script src="./vendor/puzzlescript/js/languageConstants.js"></script>
<script src="./vendor/puzzlescript/js/globalVariables.js"></script>
<script src="./vendor/puzzlescript/js/debug_off.js"></script>
<script src="./vendor/puzzlescript/js/font.js"></script>
<script src="./vendor/puzzlescript/js/rng.js"></script>
<script src="./vendor/puzzlescript/js/riffwave.js"></script>
<script src="./vendor/puzzlescript/js/sfxr.js"></script>
<script src="./vendor/puzzlescript/js/codemirror/stringstream.js"></script>
<script src="./vendor/puzzlescript/js/colors.js"></script>
<script src="./vendor/puzzlescript/js/graphics.js"></script>
<script src="./vendor/puzzlescript/js/engine.js"></script>
<script src="./vendor/puzzlescript/js/parser.js"></script>
<script src="./vendor/puzzlescript/js/compiler.js"></script>
<script src="./vendor/puzzlescript/js/inputoutput.js"></script>
<script src="./vendor/puzzlescript/js/mobile.js"></script>

<script>
function displayError(message) {
  document.getElementById("errormessage").innerHTML = "ERROR " + message + "<br>";
  document.getElementById("copyErrBtn").classList.add("show");
}

function copyErrorText() {
  var btn = document.getElementById("copyErrBtn");
  var el = document.getElementById("errormessage");
  if (!el) return;
  // Convert <br> to newlines, strip remaining tags, copy.
  var text = el.innerHTML.replace(/<br\s*\/?>/gi, "\n").replace(/<[^>]+>/g, "");
  var done = function () {
    var orig = btn.innerHTML;
    btn.innerHTML = "&#x2713;";
    setTimeout(function () { btn.innerHTML = orig; }, 900);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done, function () {
      fallbackCopy(text); done();
    });
  } else {
    fallbackCopy(text); done();
  }
}

function fallbackCopy(text) {
  var ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); } catch (e) { /* ignore */ }
  document.body.removeChild(ta);
}

// Auto-pad short level rows with '.' so authors can write uneven rows
// and the engine still sees rectangular levels. Scans the LEVELS section,
// groups consecutive level rows separated by blank lines / message lines,
// pads each group to its widest row.
function padLevels(src) {
  var lines = src.split("\n");
  var levelsStart = -1;
  for (var i = 0; i < lines.length; i++) {
    if (/^\s*LEVELS\s*$/i.test(lines[i])) {
      levelsStart = i + 1;
      while (levelsStart < lines.length && /^\s*=+\s*$/.test(lines[levelsStart])) {
        levelsStart++;
      }
      break;
    }
  }
  if (levelsStart === -1) return src;

  var pending = [];
  function flush() {
    if (pending.length === 0) return;
    var max = 0;
    for (var k = 0; k < pending.length; k++) {
      if (pending[k].content.length > max) max = pending[k].content.length;
    }
    for (var k = 0; k < pending.length; k++) {
      var p = pending[k];
      if (p.content.length < max) {
        lines[p.idx] = p.content + new Array(max - p.content.length + 1).join(".");
      }
    }
    pending = [];
  }
  for (var i = levelsStart; i < lines.length; i++) {
    var line = lines[i];
    var trimmed = line.trim();
    if (trimmed === "" || /^message\b/i.test(trimmed) || /^\(.*\)\s*$/.test(trimmed)) {
      flush();
    } else {
      pending.push({ idx: i, content: line });
    }
  }
  flush();
  return lines.join("\n");
}

function hardReset(reload) {
  // PuzzleScript stores progress under document.URL and document.URL + '_checkpoint'.
  // Clearing both forces a fresh start at level 0 next load.
  try {
    localStorage.removeItem(document.URL);
    localStorage.removeItem(document.URL + "_checkpoint");
  } catch (e) { /* ignore */ }
  if (reload) {
    // Drop the ?reset query string so reloading later doesn't keep resetting.
    location.replace(location.pathname);
  }
}

if (location.search.indexOf("reset") !== -1) {
  hardReset(false);
}

window.addEventListener("load", function () {
  document.getElementById("resetBtn").addEventListener("click", function () {
    hardReset(true);
  });
  document.getElementById("copyErrBtn").addEventListener("click", copyErrorText);

  // Show the copy-error button whenever the errormessage gets any text;
  // hide it again if the text is cleared.
  var errEl = document.getElementById("errormessage");
  var copyBtn = document.getElementById("copyErrBtn");
  var watcher = new MutationObserver(function () {
    if (errEl.textContent.trim().length > 0) {
      copyBtn.classList.add("show");
    } else {
      copyBtn.classList.remove("show");
    }
  });
  watcher.observe(errEl, { childList: true, subtree: true, characterData: true });

  fetch("./doug-platformer.txt?ts=" + Date.now())
    .then(function (r) {
      if (!r.ok) throw new Error("Could not fetch game source (" + r.status + ")");
      return r.text();
    })
    .then(function (code) {
      code = padLevels(code);
      compile(["restart"], code);
      if (typeof state !== "undefined" && state.metadata && state.metadata.title) {
        document.getElementById("gametitle").textContent = state.metadata.title;
        window.document.title = state.metadata.title;
      }
    })
    .catch(function (e) { displayError(e.message); });
});
</script>
</body>
</html>
